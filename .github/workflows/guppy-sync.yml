# Guppy sync: copies guppy/STATUS.json to Nilo's project manager, Guppy
# (https://github.com/manuelstone/guppy), every time it changes on the default branch.
# Install it as .github/workflows/guppy-sync.yml. It needs a GUPPY_TOKEN secret; see
# https://github.com/manuelstone/guppy/blob/main/docs/sync-setup.md

name: Guppy sync

on:
  push:
    paths:
      - 'guppy/STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Only the default branch publishes status; other branches are ignored.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The scripts live in Guppy, so every project runs the same, current version.
      - name: Download Guppy sync scripts
        run: |
          base=https://raw.githubusercontent.com/manuelstone/guppy/main
          dir="$RUNNER_TEMP/guppy"
          mkdir -p "$dir/scripts" "$dir/schema"
          for f in scripts/sync-status.mjs scripts/validate-status.mjs schema/status.schema.json; do
            curl -fsSL "$base/$f?nocache=$(date +%s)" -o "$dir/$f"
          done

      - name: Sync status to Guppy
        env:
          GUPPY_TOKEN: ${{ secrets.GUPPY_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node "$RUNNER_TEMP/guppy/scripts/sync-status.mjs" guppy/STATUS.json
